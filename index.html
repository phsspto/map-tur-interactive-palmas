rido</text><text class="A" x="255.03" y="428.17" font-size="4.4" fill="#ffffff" textLength="43.23" transform="rotate(-48.9 255.03 428.17)">Córrego Sussuapara</text><text class="A" x="618.48" y="615.34" font-size="4.4" fill="#ffffff" textLength="35.9" transform="rotate(-55.6 618.48 615.34)">Córrego do Prata</text><text class="S" x="283.96" y="832.94" font-size="15.87" fill="#ffffff" textLength="88.34">Lago de Palmas</text><text class="S" x="577.18" y="230.34" font-size="15.87" fill="#ffffff" textLength="98.41">Serra do Lajeado</text><text class="CB" x="1065.39" y="833.13" font-size="8.44" fill="#fff100" textLength="47.66">TAQUARUÇU: </text><text class="C" x="1114.07" y="833.13" font-size="8.44" fill="#ffffff" textLength="188.87">Fica a 32 km de Palmas. Refúgio dos ecoturistas, possui  </text><text class="C" x="1065.39" y="842.51" font-size="8.44" fill="#ffffff" textLength="235.54">mais de 80 cachoeiras e cenários exuberantes como trilhas, paredões, </text><text class="C" x="1065.39" y="851.89" font-size="8.44" fill="#ffffff" textLength="235.53">grutas, córregos e mirantes. Conheça as cachoeiras da Roncadeira de 70m </text><text class="C" x="1065.39" y="861.27" font-size="8.44" fill="#ffffff" textLength="235.5">de altura (foto), a Cachoeira do Evilson, o Vale do Vai-Quem-Quer e o </text><text class="C" x="1065.39" y="870.64" font-size="8.44" fill="#ffffff" textLength="235.51">artesanato local à base da palha de babaçu e buriti. Adeptos dos esportes </text><text class="C" x="1065.39" y="880.02" font-size="8.44" fill="#ffffff" textLength="235.52">radicais praticam rapel e tirolesa. A Tirolesa Voo do Pontal é a maior em </text><text class="C" x="1065.39" y="889.4" font-size="8.44" fill="#ffffff" textLength="235.55">operação no Brasil.  A trilha da Cachoeira da Roncadeira  dura 40 min, é </text><text class="C" x="1065.39" y="898.78" font-size="8.44" fill="#ffffff" textLength="235.53">sombreada e de fácil acesso.  Taquaruçu oferece de simples pousadas a </text><text class="C" x="1065.39" y="908.16" font-size="8.44" fill="#ffffff" textLength="139.18">hotéis fazenda. Clima ameno de 10° a 34°. </text><text class="K" x="725.66" y="293.24" font-size="2.89" fill="#221f20" textLength="13.81" transform="rotate(8.7 725.66 293.24)">APARECIDA</text><text class="K" x="725.84" y="298.07" font-size="3.95" fill="#221f20" textLength="11.98" transform="rotate(8.7 725.84 298.07)">DO RIO</text><text class="K" x="725.14" y="302.75" font-size="3.95" fill="#221f20" textLength="11.95" transform="rotate(8.7 725.14 302.75)">NEGRO</text><text class="A" x="1270.35" y="397.7" font-size="5.55" fill="#221f20" textLength="32.4">PRAIA DOS </text><text class="A" x="1270.35" y="404.37" font-size="5.55" fill="#221f20" textLength="22.16">BURITIS</text><text class="K" x="108.51" y="123.41" font-size="5.6" fill="#ffffff" textLength="20.46">América </text><text class="K" x="111.44" y="130.14" font-size="5.6" fill="#ffffff" textLength="14.6">do Sul</text><text class="K" x="127.04" y="77.16" font-size="7.77" fill="#221f20" textLength="22.55">BRASIL</text><text class="A" x="154.58" y="98.18" font-size="5.28" fill="#221f20" textLength="24.54">Tocantins</text><text class="A" x="159.3" y="84.42" font-size="3.66" fill="#ffffff" textLength="12.72">Palmas</text><text class="A" x="1163.93" y="249.09" font-size="5.55" fill="#221f20" textLength="36.73">TAQUARUÇU</text><text class="A" x="1080.21" y="252.81" font-size="5.55" fill="#221f20" textLength="39.15">TAQUARALTO</text><text class="A" x="1223.82" y="397.3" font-size="5.55" fill="#221f20" textLength="29.47">AURENY's</text><text class="S" x="368.15" y="92.13" font-size="39.38" fill="#2b308a" textLength="533.86">PALMAS-TOCANTINS   MAPA TURÍSTICO</text><text class="CB" x="797.3" y="125.24" font-size="8.66" fill="#221f20" textLength="77.67">MIRANTE DA SERRA: </text><text class="C" x="875.65" y="125.24" font-size="8.66" fill="#221f20" textLength="87.62">a 450m de altitude. De lá </text><text class="C" x="797.3" y="135.63" font-size="8.
